<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRIDIRON</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:repeating-linear-gradient(45deg,#2b1e66 0 12px,#32237a 12px 24px);font-family:'VT323',monospace;display:flex;justify-content:center;padding:24px 12px 40px}
.pix{font-family:'Press Start 2P',monospace}
#phone{position:relative;width:406px;border:8px solid #12184a;background:#12184a;box-shadow:12px 12px 0 0 rgba(0,0,0,.35)}
#screen{position:relative;width:390px;height:812px;overflow:hidden;background:linear-gradient(#43c8ff 0%,#7fe0ff 46%,#bdf3ff 72%,#e9fbff 100%)}
#sky>*{position:absolute}
.cloud{display:flex;align-items:flex-end}
.cloud i{display:block;background:#fff}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(430px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}25%{transform:scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}
#ui{position:relative;height:100%;display:flex;flex-direction:column}
#body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:14px 12px 16px}
#body::-webkit-scrollbar{width:0;height:0}
button{font-family:'VT323',monospace;cursor:pointer}
.card{background:#fffdf2;border:5px solid #1b2a6b;box-shadow:0 6px 0 0 #1b2a6b;padding:10px;width:100%;text-align:left;display:block}
.card:active,.btn:active{transform:translateY(3px);box-shadow:0 3px 0 0 #1b2a6b}
.btn{border:5px solid #1b2a6b;box-shadow:0 6px 0 0 #1b2a6b}
.row{display:flex;align-items:center;gap:9px}
.field{position:relative;background:#2e7d3a;border:3px solid #1b2a6b;overflow:hidden}
.field .lines{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 37px,rgba(255,255,255,.45) 37px 40px)}
.small{font-size:16px;color:#5566a8;line-height:1.1}
.helm{position:relative;flex:none}
.helm>div{position:absolute;left:0;top:0;width:34px;height:28px;transform-origin:top left}
.helm b{position:absolute;display:block}
nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:#1b2a6b;border-top:6px solid #0e1440}
nav button{padding:12px 4px;min-height:56px;border:0;color:#fff;font-family:'Press Start 2P',monospace;font-size:10px;background:#1b2a6b}
nav button.on{background:#3a4fa8}
nav button:not(:last-child){border-right:4px solid #0e1440}
</style>
</head>
<body>
<div id="phone"><div id="screen">
  <div id="sky">
    <div id="sun" style="top:118px;right:22px;width:46px;height:46px;background:#ffe452;box-shadow:-9px 0 0 0 #ffe452,9px 0 0 0 #ffe452,0 -9px 0 0 #ffe452,0 9px 0 0 #ffe452;animation:bob 3.2s steps(4,end) infinite"></div>
    <div class="cloud" style="top:120px;left:0;animation:drift 26s steps(24,end) infinite"><i style="width:22px;height:16px"></i><i style="width:26px;height:28px"></i><i style="width:34px;height:20px"></i><i style="width:18px;height:12px"></i></div>
    <div class="cloud" style="top:196px;left:0;opacity:.85;animation:drift 40s steps(30,end) infinite"><i style="width:16px;height:12px"></i><i style="width:30px;height:22px"></i><i style="width:20px;height:14px"></i></div>
    <div class="cloud" style="top:262px;left:0;opacity:.7;animation:drift 54s steps(30,end) infinite"><i style="width:26px;height:14px"></i><i style="width:38px;height:24px"></i><i style="width:22px;height:16px"></i></div>
  </div>
  <div style="position:absolute;bottom:0;left:0;right:0;height:150px;background:#6adf62;border-top:6px solid #3fae4b"></div>
  <div style="position:absolute;bottom:132px;left:0;right:0;height:18px;background:repeating-linear-gradient(90deg,#9ef07a 0 12px,#7fe86a 12px 24px)"></div>

  <div id="ui">
    <div style="flex:none;padding:10px 12px;background:#1b2a6b;border-bottom:6px solid #0e1440;display:flex;align-items:center;gap:10px">
      <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
        <div style="width:26px;height:18px;background:#c8622e;border:3px solid #6b2f12;border-radius:9px/6px"></div>
        <div style="min-width:0">
          <div class="pix" id="yards" style="font-size:14px;color:#ffe452;line-height:1.2">0 YD</div>
          <div id="rate" style="font-size:15px;color:#8cf25b;line-height:1">+0 YD / MIN</div>
        </div>
      </div>
      <div style="font-size:16px;color:#9fd4ff;text-align:right;line-height:1.05">TEAMS<br><span class="pix" id="owned" style="font-size:11px;color:#fff">1/32</span></div>
    </div>
    <div id="body"></div>
    <nav>
      <button id="nh" onclick="go('home')">HOME</button>
      <button id="nt" onclick="go('teams')">TEAMS</button>
      <button id="nf" onclick="go('team')">FIELD</button>
    </nav>
  </div>
</div></div>

<script>
const TEAMS = [
  {id:'det',name:'DETROIT LYNX',c:'#4a9bd6',c2:'#e8eef2',em:'patch',spec:'SPEEDSTER',cost:0},
  {id:'buf',name:'BUFFALO BRUISERS',c:'#f2f4f8',c2:'#3b6ddb',em:'bolt',spec:'BULLDOZER',cost:500},
  {id:'mia',name:'MIAMI MANATEES',c:'#3fd8c8',c2:'#ff8a3d',em:'patch',spec:'BOMB SQUAD',cost:775},
  {id:'den',name:'DENVER DRIFTERS',c:'#ff7a3d',c2:'#2b4a8f',em:'wing',spec:'BALL HAWK',cost:1200},
  {id:'aus',name:'AUSTIN ARMADILLOS',c:'#ffd23f',c2:'#a24cf0',em:'stripe',spec:'ALL-ROUNDER',cost:1860},
  {id:'sea',name:'SEATTLE SPARKS',c:'#2fbf71',c2:'#8cf25b',em:'wing',spec:'SPEEDSTER',cost:2880},
  {id:'kcy',name:'KANSAS COMETS',c:'#ff4d4d',c2:'#ffe452',em:'bolt',spec:'BOMB SQUAD',cost:4460},
  {id:'pdx',name:'PORTLAND PINES',c:'#1f7a4d',c2:'#fffdf2',em:'stripe',spec:'BULLDOZER',cost:6900}
];
const TIPS = [
  "your team runs to the right all by itself. it never goes backward. ever!",
  "reach 100 yards and you score a touchdown. then you start again!",
  "every yard you run goes in the bank. yards buy everything.",
  "tap UPGRADE to make a team faster or stronger.",
  "buy a second team and both run at the same time. that's the big one!"
];
const BASE_YPS = 5.5;
const S = {
  yards: 640, screen: 'home', sel: 'det', tipIdx: 0, banner: '', bannerAt: 0,
  teams: TEAMS.map((t,i)=>({...t, owned:i===0, pos:i===0?38:0, tds:i===0?4:0, s:1,p:0,b:0,x:0}))
};
const fmt = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1).replace('.0','')+'K' : String(Math.floor(n));
const yps = t => BASE_YPS + t.s*1.2 + (t.spec==='SPEEDSTER' ? t.x*1.4 : t.x*0.5);
const tdBonus = t => 27 + t.p*6 + (t.spec==='BULLDOZER' ? t.x*9 : t.x*2);
const cost = (t,k) => Math.round({s:50,p:75,b:120,x:200}[k] * Math.pow(1.35, t[k]));
const team = id => S.teams.find(t=>t.id===id);

// pixel helmet sprite — 34x28 grid of blocks, scaled
function helmet(t, size){
  const s = (size/34).toFixed(3), C = t.c, T = t.c2;
  const px = (x,y,w,h,bg)=>`<b style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${bg}"></b>`;
  const shell = [[6,-2,20,7],[3,1,26,7],[1,4,30,9],[0,9,31,9],[0,14,22,9],[1,19,15,8]].map(a=>px(a[0],a[1],a[2],a[3],'#12184a')).join('');
  const paint = [[8,0,16,3],[5,3,22,3],[3,6,26,5],[2,11,27,5],[2,16,18,5],[3,21,11,4]].map(a=>px(a[0],a[1],a[2],a[3],C)).join('');
  const EM = {
    stripe:[[11,0,5,16],[18,3,3,13]],
    patch:[[19,3,4,2],[17,5,8,2],[15,7,12,2],[17,9,8,2],[19,11,4,2]],
    wing:[[10,4,16,3],[14,8,13,3],[19,12,8,3]],
    bolt:[[20,3,4,5],[15,8,9,4],[12,12,5,4]]
  }[t.em].map(a=>px(a[0],a[1],a[2],a[3],T)).join('');
  const mask = px(6,13,7,6,'#12184a') + [[17,14,16,5],[18,20,15,5],[28,14,6,11]].map(a=>px(a[0],a[1],a[2],a[3],'#12184a')).join('')
    + [[18,15,14,3],[19,21,13,3],[29,15,4,9]].map(a=>px(a[0],a[1],a[2],a[3],'#fffdf2')).join('');
  return `<div class="helm" style="width:${Math.round(34*s)}px;height:${Math.round(28*s)}px">
    <div style="transform:scale(${s})">${shell}${paint}${EM}${mask}</div></div>`;
}

const COACH = (()=>{
  const p=(x,y,w,h,bg)=>`<b style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${bg}"></b>`;
  return `<div class="helm" style="width:32px;height:46px;animation:bob 2.4s steps(3,end) infinite">
  <div style="width:22px;height:32px;transform:scale(1.42)">
  ${p(5,0,12,4,'#ffd23f')}${p(3,4,17,2,'#e8a400')}${p(5,6,12,7,'#ffd9a8')}
  ${p(7,8,2,2,'#12184a')}${p(13,8,2,2,'#12184a')}${p(9,11,5,1,'#c98b5e')}${p(8,13,6,2,'#ffd9a8')}
  ${p(2,15,18,10,'#3fd8ff')}${p(8,15,6,3,'#fffdf2')}${p(10,18,2,5,'#fffdf2')}
  ${p(0,16,3,7,'#3fd8ff')}${p(19,16,3,7,'#3fd8ff')}${p(0,23,3,3,'#ffd9a8')}${p(19,23,3,3,'#ffd9a8')}
  ${p(16,19,6,8,'#fffdf2')}${p(17,21,4,1,'#5566a8')}${p(17,23,4,1,'#5566a8')}
  ${p(4,25,6,6,'#cbb89a')}${p(12,25,6,6,'#cbb89a')}${p(3,30,7,2,'#fffdf2')}${p(12,30,7,2,'#fffdf2')}
  </div></div>`;
})();

function tick(){
  const dt=0.2; let gained=0, banner='';
  S.teams.forEach(t=>{
    if(!t.owned) return;
    t.pos += yps(t)*dt;
    const chance=(t.b*0.02 + (t.spec==='BOMB SQUAD'?t.x*0.02:0))*dt;
    if(Math.random()<chance){ const j=20+t.b*2; t.pos+=j; banner='BIG PLAY! +'+j; }
    gained += yps(t)*dt*(t.spec==='BALL HAWK' ? 1+t.x*0.12 : 1);
    if(t.pos>=100){ t.pos-=100; t.tds++; const b=tdBonus(t); gained+=b; banner='TOUCHDOWN! +'+b; }
  });
  S.yards += gained;
  if(banner){ S.banner=banner; S.bannerAt=Date.now(); }
  else if(Date.now()-S.bannerAt>1400) S.banner='';
  render();
}
function go(s){ S.screen=s; render(); }
function open(id){ S.sel=id; S.screen='team'; render(); }
function buy(id,k){ const t=team(id), c=cost(t,k); if(S.yards<c) return; S.yards-=c; t[k]++; render(); }
function buyTeam(id){ const t=team(id); if(t.owned||S.yards<t.cost) return; S.yards-=t.cost; t.owned=true; open(id); }
function nextTip(){ S.tipIdx++; render(); }

function driveCard(t){
  return `<button class="card" onclick="open('${t.id}')" style="margin-bottom:10px">
    <div class="row" style="gap:8px;margin-bottom:8px">${helmet(t,38)}
      <div style="flex:1;min-width:0">
        <div class="pix" style="font-size:10px;color:#1b2a6b">${t.name}</div>
        <div class="small">${t.spec} · ${yps(t).toFixed(1)} YD/SEC</div>
      </div>
      <div class="pix" style="font-size:10px;color:#ff7a3d">${t.tds} TD</div>
    </div>
    <div class="field" style="height:24px"><div class="lines"></div>
      <div style="position:absolute;top:0;bottom:0;right:0;width:26px;background:repeating-linear-gradient(45deg,${t.c} 0 6px,#1b2a6b 6px 12px)"></div>
      <div style="position:absolute;top:3px;left:${Math.min(96,t.pos*.9)}%;width:12px;height:12px;background:${t.c2};border:3px solid #1b2a6b"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:15px;color:#5566a8;margin-top:4px">
      <span>${Math.floor(t.pos)} YARD LINE</span><span>${Math.max(1,Math.ceil(100-t.pos))} TO GO</span></div>
  </button>`;
}
const tile = (label,sub,bg,fn) => `<button class="btn" onclick="${fn}" style="padding:14px 8px;min-height:74px;background:${bg};font-family:'Press Start 2P',monospace;font-size:11px;color:#1b2a6b">${label}<div style="font-family:'VT323',monospace;font-size:16px;margin-top:6px">${sub}</div></button>`;
const backBar = title => `<div class="row" style="gap:8px;margin-bottom:12px">
  <button class="btn" onclick="go('home')" style="padding:8px 10px;min-height:44px;background:#fffdf2;font-family:'Press Start 2P',monospace;font-size:10px;color:#1b2a6b">&lt; BACK</button>
  <div class="pix" style="font-size:13px;color:#12184a">${title}</div></div>`;

function screenHome(){
  const owned = S.teams.filter(t=>t.owned);
  return `<div style="text-align:center;margin:6px 0 16px">
    <div class="pix" style="font-size:30px;color:#fff;text-shadow:0 5px 0 #1b2a6b,0 9px 0 rgba(0,0,0,.25)">GRID<br>IRON</div>
    <div style="display:inline-block;margin-top:12px;padding:3px 10px;background:#ffe452;border:4px solid #1b2a6b;font-size:18px;color:#1b2a6b">RUN FOREVER. NEVER BACKWARD.</div></div>
  <div class="pix" style="font-size:10px;color:#12184a;margin:0 0 8px">LIVE DRIVES</div>
  ${owned.map(driveCard).join('')}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px">
    ${tile('TEAMS','BUY A NEW TEAM','#8cf25b',"go('teams')")}
    ${tile('UPGRADE','SPEND YOUR YARDS','#ffd23f',"go('team')")}
    <div style="padding:14px 8px;min-height:74px;background:#dfe4f5;border:5px solid #5566a8;font-family:'Press Start 2P',monospace;font-size:11px;color:#3c4a86">DRAFT<div style="font-family:'VT323',monospace;font-size:16px;margin-top:6px">SOON</div></div>
    <div style="padding:14px 8px;min-height:74px;background:#dfe4f5;border:5px solid #5566a8;font-family:'Press Start 2P',monospace;font-size:11px;color:#3c4a86">TROPHIES<div style="font-family:'VT323',monospace;font-size:16px;margin-top:6px">SOON</div></div>
  </div>`;
}
function screenTeams(){
  return backBar('ALL TEAMS') + S.teams.map(t=>{
    const ok = S.yards>=t.cost;
    const label = t.owned?'OPEN':(ok?'BUY':'LOCKED');
    const bg = t.owned?'#ffd23f':(ok?'#8cf25b':'#cfd6ef');
    const act = t.owned?`open('${t.id}')`:`buyTeam('${t.id}')`;
    const status = t.owned ? `RUNNING · ${t.spec} · ${t.tds} TD` : `${t.spec} · COSTS ${fmt(t.cost)} YD`;
    return `<div style="padding:10px;margin-bottom:10px;background:${t.owned?'#fffdf2':'#e7ebf8'};border:5px solid #1b2a6b;box-shadow:0 6px 0 0 #1b2a6b">
      <div class="row">${helmet(t,40)}
        <div style="flex:1;min-width:0"><div class="pix" style="font-size:10px;color:#1b2a6b">${t.name}</div>
        <div class="small">${status}</div></div>
        <button class="btn" onclick="${act}" style="padding:8px 9px;min-height:44px;background:${bg};border-width:4px;font-family:'Press Start 2P',monospace;font-size:9px;color:#1b2a6b">${label}</button>
      </div></div>`;
  }).join('');
}
function screenTeam(){
  const t = team(S.sel);
  const ups = [['s','SPEED','run more yards every second','#3fd8ff'],['p','POWER','bigger touchdown bonus','#ff7a3d'],
    ['b','BIG PLAYS','jump way down the field','#a24cf0'],['x','SPECIALTY','grow '+t.spec+' even more','#ff5fa8']];
  return backBar(t.name) + `
  <div style="padding:10px;background:#fffdf2;border:5px solid #1b2a6b;box-shadow:0 7px 0 0 #1b2a6b;margin-bottom:16px">
    <div class="row" style="gap:8px;margin-bottom:8px">${helmet(t,48)}
      <div style="flex:1;font-size:17px;color:#5566a8;line-height:1.1">${t.spec}<br><span style="color:#1b2a6b">${yps(t).toFixed(1)} YD/SEC · ${t.tds} TOUCHDOWNS</span></div></div>
    <div class="field" style="height:74px;border-width:4px"><div class="lines" style="background:repeating-linear-gradient(90deg,transparent 0 33px,rgba(255,255,255,.4) 33px 37px)"></div>
      <div style="position:absolute;top:0;bottom:0;right:0;width:34px;background:repeating-linear-gradient(45deg,${t.c} 0 8px,#1b2a6b 8px 16px)"></div>
      <div style="position:absolute;top:20px;left:${Math.min(96,t.pos*.9)}%;width:20px;height:28px;background:${t.c2};border:4px solid #1b2a6b"></div>
      <div style="position:absolute;left:6px;bottom:3px;font-size:15px;color:#d6ffd0">${Math.floor(t.pos)} YD</div></div>
    ${S.banner?`<div class="pix" style="margin-top:8px;text-align:center;font-size:12px;color:#ff5fa8;animation:pop .9s steps(6,end)">${S.banner}</div>`:''}
  </div>
  <div class="pix" style="font-size:10px;color:#12184a;margin:0 0 8px">SPEND YARDS</div>
  ${ups.map(([k,label,desc,chip])=>{
    const c=cost(t,k), ok=S.yards>=c;
    return `<button class="card" onclick="buy('${t.id}','${k}')" style="min-height:70px;margin-bottom:10px;background:${ok?'#fffdf2':'#dfe4f5'}">
      <div class="row"><div style="width:26px;height:26px;background:${chip};border:3px solid #1b2a6b;flex:none"></div>
      <div style="flex:1;min-width:0"><div class="pix" style="font-size:10px;color:#1b2a6b">${label}</div>
      <div class="small" style="color:#41508c">${desc}</div></div>
      <div style="text-align:right"><div class="pix" style="font-size:10px;color:#1b2a6b">${fmt(c)} YD</div>
      <div style="font-size:15px;color:#41508c">LV ${t[k]}</div></div></div></button>`;
  }).join('')}`;
}
function coachBox(){
  if(S.tipIdx>=TIPS.length) return '';
  return `<div style="margin-top:16px;display:flex;gap:9px;align-items:flex-start;padding:10px;background:#1b2a6b;border:5px solid #0e1440;box-shadow:0 6px 0 0 rgba(0,0,0,.3)">
    ${COACH}<div style="flex:1;font-size:17px;color:#fff;line-height:1.2">COACH: ${TIPS[S.tipIdx]}</div>
    <button onclick="nextTip()" style="padding:6px 8px;min-height:44px;background:#8cf25b;border:4px solid #0e1440;font-family:'Press Start 2P',monospace;font-size:9px;color:#1b2a6b">OK</button></div>`;
}

function render(){
  const owned = S.teams.filter(t=>t.owned);
  const rate = owned.reduce((a,t)=>a + yps(t)*60 + tdBonus(t)*(yps(t)*60/100), 0);
  yards.textContent = fmt(S.yards)+' YD';
  document.getElementById('rate').textContent = '+'+fmt(rate)+' YD / MIN';
  document.getElementById('owned').textContent = owned.length+'/32';
  document.getElementById('sky').style.display = S.screen==='home' ? '' : 'none';
  nh.className = S.screen==='home'?'on':''; nt.className = S.screen==='teams'?'on':''; nf.className = S.screen==='team'?'on':'';
  const view = S.screen==='home' ? screenHome() : S.screen==='teams' ? screenTeams() : screenTeam();
  document.getElementById('body').innerHTML = view + coachBox();
}
render();
setInterval(tick, 200);
</script>
</body>
</html>
